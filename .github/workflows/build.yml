name: build
on: [push, pull_request, workflow_dispatch]
env:
  # r28c: the NDK used by real LeviLauncher mods. Do NOT use ANDROID_NDK_LATEST_HOME: NDK r30's libc++ broke
  # the preloader SDK's fmt (missing <cstdlib>). CMakeLists.txt also forces that include as a safety net.
  NDK_VERSION: 28.2.13676358
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: cmake -S . -B build-host && cmake --build build-host && ctest --test-dir build-host --output-on-failure
  android:
    needs: host-tests
    runs-on: ubuntu-latest   # LeviLauncher is arm64-v8a only; armeabi-v7a is not built
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build-arm64-v8a -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared
      - run: cmake --build build-arm64-v8a --target levi_package
      - uses: actions/upload-artifact@v4
        with:
          name: levipack-arm64-v8a
          path: build-arm64-v8a/*.levipack
      - name: Java mod -> levipack end-to-end (sample jar)
        run: |
          mkdir -p sample && cp tests/java/Calc.java sample/ && javac -d sample sample/Calc.java
          (cd sample && jar cf ../Calc.jar Calc.class)
          python3 tools/levicrate.py build Calc.jar -o Calc.levipack --workdir build-java
          unzip -l Calc.levipack
      - uses: actions/upload-artifact@v4
        with:
          name: levipack-converted-sample
          path: |
            Calc.levipack
            Calc.PORTING.md
